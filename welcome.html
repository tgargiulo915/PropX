<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Welcome to PropX</title>
<style>body{margin:0;font:17px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;background:#0f1216;color:#eef1f4;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box}
.c{max-width:520px;width:100%;background:#181d23;border:1px solid #2a323b;border-radius:12px;padding:28px}h1{margin:0 0 8px;font-size:26px}p{color:#aab4bf}
.k{font:600 18px ui-monospace,Menlo,monospace;background:#0f1216;border:1px solid #2a323b;border-radius:8px;padding:14px;word-break:break-all;margin:14px 0;color:#fff}
button,a.b{display:inline-block;background:#d4a437;color:#2a1d00;font-weight:800;border:0;border-radius:8px;padding:11px 18px;cursor:pointer;text-decoration:none;font-size:16px;margin:0 8px 8px 0}</style></head><body><div class="c" id="c"><h1>Checking your payment…</h1><p>This takes a few seconds.</p></div>
<script>
(function(){var c=document.getElementById("c"),sid=new URLSearchParams(location.search).get("session_id")||"",n=0;
function esc(s){var d=document.createElement("div");d.textContent=String(s);return d.innerHTML}
function fail(m){c.innerHTML="<h1>Almost there</h1><p>"+esc(m)+"</p><p>If you paid, your key will be emailed to you by Stripe's receipt address shortly, or contact support with your receipt.</p>"}
function poll(){n++;fetch("/api/claim?session_id="+encodeURIComponent(sid)).then(function(r){return r.json()}).then(function(j){
if(j.key){c.innerHTML="<h1>You're in.</h1><p>Your "+esc(j.plan||"")+" plan is active with "+esc(j.limit)+" searches a month. Save this key somewhere safe. It is your login.</p><div class='k' id='k'>"+esc(j.key)+"</div><button id='cp'>Copy key</button><a class='b' href='/?key="+encodeURIComponent(j.key)+"'>Open PropX</a>";
document.getElementById("cp").onclick=function(){try{navigator.clipboard.writeText(j.key);this.textContent="Copied"}catch(e){}};try{history.replaceState(null,"","/welcome.html")}catch(e){}return}
if(j.error)return fail(j.error);if(n>=15)return fail("Your payment is still being confirmed.");setTimeout(poll,2000)}).catch(function(){if(n>=15)fail("Couldn't reach the server.");else setTimeout(poll,2000)})}
if(!/^cs_/.test(sid))fail("This page needs the link you were sent after paying.");else poll()})();
</script></body></html>
