<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PropX Admin</title>
<style>
:root{--hero:#0B3B36;--hi:#EAF4F1;--hm:#9EC2BA;--brass:#E0A526;--paper:#F7F6F2;--card:#fff;--ink:#16211F;--mute:#5E6B68;--line:#DAD8CF;--good:#117A55;--bad:#B42318}
@media (prefers-color-scheme:dark){:root{--paper:#101716;--card:#182120;--ink:#E7EEEC;--mute:#97A8A4;--line:#27332F;--good:#4CC38A;--bad:#F27B70}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{background:var(--hero);color:var(--hi);padding:18px 22px;font-weight:800;font-size:20px}header b{color:var(--brass)}
main{max-width:980px;margin:0 auto;padding:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
h2{margin:0 0 12px;font-size:18px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>div{flex:1;min-width:160px}
button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:9px 16px;background:var(--brass);color:#2A1D00;cursor:pointer}
button.sm{padding:5px 10px;font-size:13px;background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:600}
button:disabled{opacity:.6}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--mute);font-weight:600}
code{font:13px ui-monospace,Menlo,monospace;word-break:break-all}
.msg{margin-top:10px;min-height:22px;font-size:14px}.bad{color:var(--bad)}.good{color:var(--good)}
.newkey{margin-top:12px;padding:12px;border:2px solid var(--good);border-radius:8px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--good)}.bar i.hot{background:#B45309}.bar i.full{background:var(--bad)}.sub{display:block;font-size:12px;color:var(--mute)}
.wrap{overflow-x:auto}
</style>
</head>
<body>
<header>Prop<b>X</b> admin</header>
<main>
<div class="card" id="login">
<h2>Admin secret</h2>
<div class="row"><div><label for="sec">Enter the ADMIN_SECRET you set in Vercel</label><input id="sec" type="password" autocomplete="off"></div><button id="go" type="button">Sign in</button></div>
<div class="msg" id="lm" role="status"></div>
</div>
<div id="app" hidden>
<div class="card">
<h2>Add a customer</h2>
<div class="row">
<div><label for="nm">Customer name</label><input id="nm" placeholder="Acme Homes"></div>
<div style="max-width:200px"><label for="lm2">Searches per month</label><input id="lm2" type="number" min="1" value="100"></div>
<button id="add" type="button">Create access key</button>
</div>
<div id="nk"></div>
<div class="msg" id="am" role="status"></div>
</div>
<div class="card">
<h2>Needs approval</h2>
<p style="color:var(--mute);margin:0 0 8px">Customers who paid. Their key works as soon as you approve.</p>
<div id="pa"></div>
</div>
<div class="card">
<h2>Sign-ups</h2>
<p style="color:var(--mute);margin:0 0 8px">People who created an account. Approve someone ahead of time and their key activates the moment they pay.</p>
<div class="wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Status</th><th></th></tr></thead><tbody id="sg"></tbody></table></div>
</div>
<div class="card">
<h2>Customers</h2>
<p id="sum" style="margin:0 0 6px;font-weight:600"></p>
<p id="cap" style="color:var(--mute);margin:0 0 10px"></p>
<div style="margin:0 0 10px"><label for="q">Find a customer</label><input id="q" placeholder="Search by name, email or key" style="max-width:340px"></div>
<div class="wrap"><table><thead><tr><th>Customer</th><th>Plan</th><th>Key</th><th>Used / limit</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="msg" id="tm" role="status"></div>
</div>
</div>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var secret="";
var esc=function(s){var d=document.createElement("div");d.textContent=String(s==null?"":s);return d.innerHTML};
async function api(body){
var r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json","x-admin-secret":secret},body:JSON.stringify(body)});
var j={};try{j=await r.json()}catch(e){}
if(!r.ok)throw new Error(j.error||("Request failed ("+r.status+")"));
return j}
async function load(){
$("tm").textContent="";
try{
var j=await api({action:"list"});
$("cap").textContent="Month "+j.month+". Our RentCast requests used: "+j.rentcast.used+" of "+j.rentcast.limit+" (each search uses 3). Raise MONTHLY_REQUEST_LIMIT in Vercel when you upgrade RentCast.";
var pend=j.customers.filter(function(c){return c.approval==="pending"});
$("pa").innerHTML=pend.length?'<table><thead><tr><th>Customer</th><th>Plan</th><th>Key</th><th></th></tr></thead><tbody>'+pend.map(function(c){return"<tr><td>"+esc(c.name)+(c.company?'<span class="sub">'+esc(c.company)+"</span>":"")+(c.email?'<span class="sub">'+esc(c.email)+"</span>":"")+"</td><td>"+esc(c.plan||"manual")+"</td><td><code>"+esc(c.key)+'</code></td><td><button class="sm" data-ap="approve" data-k="'+esc(c.key)+'">Approve</button> <button class="sm" data-ap="reject" data-k="'+esc(c.key)+'">Reject</button></td></tr>'}).join("")+"</tbody></table>":'<p style="margin:0;color:var(--mute)">Nobody is waiting for approval.</p>';
var q=($("q").value||"").toLowerCase();
var list=j.customers.filter(function(c){return !q||(c.name+" "+c.email+" "+c.key+" "+c.plan).toLowerCase().indexOf(q)>=0});
$("sum").textContent=j.summary?(j.summary.active+" active of "+j.summary.total+" customers. Plan revenue: $"+j.summary.mrr+"/month (customers on a listed plan)."):"";
$("tb").innerHTML=list.length?list.map(function(c){
var pct=c.limit?Math.min(100,Math.round(c.used/c.limit*100)):0;
var cls=pct>=100?"full":pct>=80?"hot":"";
return '<tr><td>'+esc(c.name)+(c.email&&c.email!==c.name?'<span class="sub">'+esc(c.email)+'</span>':'')+(c.note?'<span class="sub">Note: '+esc(c.note)+'</span>':'')+'</td><td>'+esc(c.plan||"manual")+'</td><td><code>'+esc(c.key)+'</code></td><td>'+c.used+' / '+c.limit+' ('+pct+'%)<div class="bar"><i class="'+cls+'" style="width:'+pct+'%"></i></div></td><td>'+(c.approval==="pending"?'<span class="bad">Awaiting approval</span>':c.approval==="rejected"?'<span class="bad">Rejected</span>':c.active?'<span class="good">Active</span>':'<span class="bad">Off</span>')+'</td><td><button class="sm" data-a="lim" data-k="'+esc(c.key)+'" data-l="'+c.limit+'">Change limit</button> <button class="sm" data-a="note" data-k="'+esc(c.key)+'" data-n="'+esc(c.note)+'">Note</button> <button class="sm" data-a="lnk" data-k="'+esc(c.key)+'">Copy link</button> <button class="sm" data-a="tog" data-k="'+esc(c.key)+'" data-on="'+(c.active?1:0)+'">'+(c.active?'Turn off':'Turn on')+'</button></td></tr>'}).join(""):'<tr><td colspan="6" style="color:var(--mute)">'+(j.customers.length?"No match.":"No customers yet.")+'</td></tr>';
}catch(e){$("tm").innerHTML='<span class="bad">'+esc(e.message)+'</span>'}}
async function loadSg(){try{var s=await api({action:"signups"});$("sg").innerHTML=s.signups.length?s.signups.map(function(x){var st=x.status==="approved"?'<span class="good">Approved</span>':x.status==="rejected"?'<span class="bad">Rejected</span>':"Pending";return"<tr><td>"+esc(x.name||"(no name)")+(x.company?'<span class="sub">'+esc(x.company)+"</span>":"")+"</td><td>"+esc(x.email)+'<span class="sub">'+esc((x.at||"").slice(0,10))+(x.paid?" · paid":"")+"</span></td><td>"+st+"</td><td>"+(x.status!=="approved"?'<button class="sm" data-s="approved" data-e="'+esc(x.email)+'">Approve</button> ':"")+(x.status!=="rejected"?'<button class="sm" data-s="rejected" data-e="'+esc(x.email)+'">Reject</button>':"")+"</td></tr>"}).join(""):'<tr><td colspan="4" style="color:var(--mute)">No sign-ups yet.</td></tr>'}catch(e){}}
$("q").addEventListener("input",function(){if(!$("app").hidden)load()});
$("go").onclick=async function(){
secret=$("sec").value;$("lm").textContent="";
try{await api({action:"list"});$("login").hidden=true;$("app").hidden=false;load();loadSg()}catch(e){secret="";$("lm").innerHTML='<span class="bad">'+esc(e.message)+'</span>'}};
$("sec").addEventListener("keydown",function(e){if(e.key==="Enter")$("go").click()});
$("add").onclick=async function(){
$("am").textContent="";$("nk").innerHTML="";$("add").disabled=true;
try{var j=await api({action:"create",name:$("nm").value,limit:$("lm2").value});
$("nk").innerHTML='<div class="newkey"><b>Key for '+esc(j.name)+' ('+j.limit+' searches/month). Copy it now and send it to the customer:</b><br><code id="kv">'+esc(j.key)+'</code> <button class="sm" id="cp" type="button">Copy</button><br>Or send this guest link, which has the key built in:<br><code>'+esc(location.origin+"/?key="+j.key)+'</code> <button class="sm" id="cpl" type="button">Copy link</button></div>';
$("cpl").onclick=function(){try{navigator.clipboard.writeText(location.origin+"/?key="+j.key);$("cpl").textContent="Copied"}catch(e){}};
$("cp").onclick=function(){try{navigator.clipboard.writeText(j.key);$("cp").textContent="Copied"}catch(e){}};
$("nm").value="";load()}catch(e){$("am").innerHTML='<span class="bad">'+esc(e.message)+'</span>'}
finally{$("add").disabled=false}};
$("pa").addEventListener("click",async function(e){var b=e.target.closest("button");if(!b)return;
try{await api({action:b.getAttribute("data-ap"),key:b.getAttribute("data-k")});await load();loadSg()}catch(err){$("tm").innerHTML='<span class="bad">'+esc(err.message)+'</span>'}});
$("sg").addEventListener("click",async function(e){var b=e.target.closest("button");if(!b)return;
try{await api({action:"setsignup",email:b.getAttribute("data-e"),status:b.getAttribute("data-s")});loadSg()}catch(err){$("tm").innerHTML='<span class="bad">'+esc(err.message)+'</span>'}});
$("tb").addEventListener("click",async function(e){
var b=e.target.closest("button");if(!b)return;
var k=b.getAttribute("data-k"),a=b.getAttribute("data-a");
try{
if(a==="lnk"){try{navigator.clipboard.writeText(location.origin+"/?key="+k);b.textContent="Copied"}catch(x){}return}
if(a==="tog"){await api({action:"update",key:k,active:b.getAttribute("data-on")!=="1"})}
else if(a==="note"){var nt=window.prompt("Note for this customer (shown in the list):",b.getAttribute("data-n")||"");if(nt===null)return;await api({action:"update",key:k,note:nt})}
else if(a==="lim"){var v=window.prompt("New searches per month for this customer:",b.getAttribute("data-l"));if(v===null)return;await api({action:"update",key:k,limit:v})}
load()}catch(err){$("tm").innerHTML='<span class="bad">'+esc(err.message)+'</span>'}});
})();
</script>
</body>
</html>
